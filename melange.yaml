# Melange configuration for gw2wrapper
# Builds the Rust application as a Wolfi APK package
# https://github.com/chainguard-dev/melange

package:
  name: gw2wrapper
  version: 0.1.0
  epoch: 0
  description: "Minimal, secure Guild Wars 2 API wrapper"
  url: "https://github.com/KrijnvanderBurg/gw2wrapper"
  copyright:
    - license: "Apache-2.0"

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os

    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub

    packages:
      - build-base
      - busybox
      # Must match rust-toolchain.toml and mise.toml
      - cargo-auditable~0.7.6
      - rust-1.98~1.98.1
      - ca-certificates-bundle

# Source is this repo's root (melange mounts the directory containing this
# file as the workspace by default, minus .melangeignore), so no git-checkout step is needed.
pipeline:
  # Same command as `just build-release`
  - runs: |
      cargo auditable build --locked --release
      install -Dm755 target/release/gw2wrapper "${{targets.destdir}}/usr/local/bin/gw2wrapper"

# Runs in a fresh environment containing only the built package and these extras
test:
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - busybox
  pipeline:
    - runs: |
        test "$(/usr/local/bin/gw2wrapper)" = "Hello, World!"
