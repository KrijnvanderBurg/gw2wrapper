# Melange configuration for gw2wrapper
# Builds the Rust application as a Wolfi APK package
# https://github.com/chainguard-dev/melange

package:
  name: hello-world
  version: 0.1.0
  epoch: 0
  description: "GW2 Wrapper - Minimal secure Rust application"
  url: "https://github.com/KrijnvanderBurg/gw2wrapper"
  copyright:
    - license: "MIT"

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os

    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub

    packages:
      - build-base
      - busybox
      - cargo-auditable
      - rust
      - ca-certificates-bundle

# Source is this repo's root (melange mounts the directory containing this
# file as the workspace by default), so no git-checkout step is needed.
pipeline:
  - uses: cargo/build
    with:
      opts: --locked --release
      output: hello-world
      prefix: usr
      install-dir: local/bin

# Runs in a fresh environment containing only the built package and these extras
test:
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      packages:
        - busybox
  pipeline:
    - runs: |
        test "$(/usr/local/bin/hello-world)" = "Hello, World!"
