# Pre-commit hooks for Rust project
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # Rust formatting (rustfmt)
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt

  # Rust check, test & lint (mirrors CI "Check, Test & Lint" job)
  - repo: local
    hooks:
      - id: cargo-check
        name: cargo check
        description: Check the package for errors
        entry: cargo check --all-targets
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        description: Run the test suite
        entry: cargo test --all-targets
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: Clippy
        description: Run Clippy to catch common mistakes
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # Rust security & dependency audit (mirrors CI "Security & Dependency Audit" job)
      - id: cargo-deny-advisories
        name: cargo-deny (advisories)
        entry: cargo deny check advisories
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|deny\.toml)$'
        pass_filenames: false

      - id: cargo-deny-licenses
        name: cargo-deny (licenses)
        entry: cargo deny check licenses
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|deny\.toml)$'
        pass_filenames: false

      - id: cargo-deny-bans-sources
        name: cargo-deny (bans & sources)
        entry: cargo deny check bans sources
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|deny\.toml)$'
        pass_filenames: false
