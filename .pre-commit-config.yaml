# Pre-commit hooks for Rust project
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # Every hook below runs the same just recipe as the matching CI step, so a pass here means a pass in CI
  - repo: local
    hooks:
      # CI "Check, Test & Lint"
      - id: cargo-check
        name: cargo check
        entry: just check
        language: system
        files: '\.rs$|(^|/)(Cargo\.(toml|lock)|justfile)$'
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: just test
        language: system
        files: '\.rs$|(^|/)(Cargo\.(toml|lock)|justfile)$'
        pass_filenames: false

      - id: clippy
        name: cargo clippy
        entry: just clippy
        language: system
        files: '\.rs$|(^|/)(Cargo\.(toml|lock)|justfile)$'
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        entry: just fmt
        language: system
        files: '\.rs$|(^|/)(Cargo\.(toml|lock)|justfile)$'
        pass_filenames: false

      # CI "Security & Dependency Audit"
      - id: cargo-deny-advisories
        name: cargo-deny (advisories)
        entry: just deny-advisories
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|deny\.toml|justfile)$'
        pass_filenames: false

      - id: cargo-deny-licenses
        name: cargo-deny (licenses)
        entry: just deny-licenses
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|deny\.toml|justfile)$'
        pass_filenames: false

      - id: cargo-deny-bans-sources
        name: cargo-deny (bans & sources)
        entry: just deny-bans
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|deny\.toml|justfile)$'
        pass_filenames: false

      # CI "Build & Container Verification"
      - id: verify-image
        name: melange test, apko build & Trivy scan
        entry: just verify-image
        language: system
        files: '\.rs$|(^|/)(Cargo\.(toml|lock)|melange\.yaml|apko\.yaml|trivy\.yaml|justfile)$'
        pass_filenames: false
