# apko configuration for gw2wrapper
# Minimal OCI image with explicit dependencies
# https://github.com/chainguard-dev/apko

annotations:
  org.opencontainers.image.source: "https://github.com/KrijnvanderBurg/gw2wrapper"
  org.opencontainers.image.title: "gw2wrapper"

contents:
  repositories:
    - https://packages.wolfi.dev/os

  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub

  packages:
    # CA certificates for HTTPS
    - ca-certificates-bundle

    # Minimal base layout
    - wolfi-baselayout

accounts:
  users:
    - username: appuser
      uid: 65532
      gid: 65532
      shell: /sbin/nologin

  groups:
    - groupname: appuser
      gid: 65532

paths:
  - path: /tmp
    type: directory
    permissions: 0o1777

entrypoint:
  command: /usr/local/bin/hello-world

cmd: ""
work-dir: /

archs:
  - x86_64
