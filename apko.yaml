# apko configuration for gw2wrapper
# Minimal OCI image with explicit dependencies
# https://github.com/chainguard-dev/apko

annotations:
  org.opencontainers.image.source: "https://github.com/KrijnvanderBurg/gw2wrapper"
  org.opencontainers.image.title: "gw2wrapper"

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local repo of packages built from melange.yaml (see justfile: melange-build)
    - "@local ./packages"

  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - melange.rsa.pub

  packages:
    # CA certificates for HTTPS
    - ca-certificates-bundle
    - hello-world@local

accounts:
  users:
    - username: appuser
      uid: 65532
      gid: 65532
      shell: /sbin/nologin

  groups:
    - groupname: appuser
      gid: 65532

  run-as: appuser

# Restrict the binary to the app user, mirroring the previous Dockerfile's
# --chown=appuser:appuser --chmod=0500
paths:
  - path: /usr/local/bin/hello-world
    type: permissions
    uid: 65532
    gid: 65532
    permissions: 0o500

entrypoint:
  command: /usr/local/bin/hello-world

cmd: ""
work-dir: /

archs:
  - x86_64
