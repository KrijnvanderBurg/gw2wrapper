# Single source of truth for tool versions, used by both the devcontainer and CI.
# The Rust toolchain itself is pinned in rust-toolchain.toml.
# Keep in sync with .devcontainer/Dockerfile and the mise-action version in .github/workflows.
min_version = "2026.9.18"

[settings]
# Install only the exact versions and checksums recorded in mise.lock.
# `paranoid` is only honoured globally, so it is set via MISE_PARANOID in the devcontainer and CI.
lockfile = true
locked = true

[tools]
actionlint = "1.7.12"
apko = "1.4.5"
cargo-deny = "0.20.2"
"cargo:cargo-auditable" = "0.7.6"
committed = "1.1.11"
cosign = "3.1.3"
gitleaks = "8.30.1"
grype = "0.119.0"
hadolint = "2.15.1"
just = "1.58.0"
melange = "0.61.1"
pre-commit = "4.6.2"
shellcheck = "0.11.0"
taplo = "0.10.0"
trivy = "0.74.0"
typos = "1.50.3"
yamllint = "1.38.0"
zizmor = "1.30.1"
