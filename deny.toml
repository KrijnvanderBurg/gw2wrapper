# Cargo-deny configuration for gw2wrapper
# Comprehensive dependency security and compliance checks
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# FOSS-only policy: permissive and weak-copyleft licenses only
# All licenses are denied unless explicitly allowed, so there is no need for
# a separate GPL/AGPL/SSPL deny list (see https://github.com/EmbarkStudios/cargo-deny/pull/611)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
]
# Don't warn about allowed licenses not yet used by any dependency
unused-allowed-license = "warn"
confidence-threshold = 0.8
exceptions = []

[bans]
# Deny multiple versions of the same crate
multiple-versions = "warn"
# Deny wildcard dependencies
wildcards = "warn"

[sources]
# Only allow crates.io
allow-org = { github = [] }
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

unknown-registry = "deny"
unknown-git = "deny"
