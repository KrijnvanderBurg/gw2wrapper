name: Rust CICD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cargo check
        run: just check

      - name: Cargo test
        run: just test

      - name: Cargo clippy
        run: just clippy

      - name: Cargo fmt
        run: just fmt

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cargo deny (advisories)
        run: just deny-advisories

      - name: Cargo deny (licenses)
        run: just deny-licenses

      - name: Cargo deny (bans & sources)
        run: just deny-bans

  build:
    name: Build & Container Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-auditable
        run: cargo install cargo-auditable

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build release binary
        run: just build-release

      - name: Verify binary
        run: |
          file target/release/hello-world
          ldd target/release/hello-world

      - name: Install melange
        env:
          MELANGE_VERSION: 0.61.1
        run: |
          curl -sSfL "https://github.com/chainguard-dev/melange/releases/download/v${MELANGE_VERSION}/melange_${MELANGE_VERSION}_linux_amd64.tar.gz" \
            | tar -xzf - -C /tmp
          find /tmp -type f -name melange -exec mv {} /usr/local/bin/melange \;
          chmod +x /usr/local/bin/melange

      - name: Install apko
        env:
          APKO_VERSION: 1.4.5
        run: |
          curl -sSfL "https://github.com/chainguard-dev/apko/releases/download/v${APKO_VERSION}/apko_${APKO_VERSION}_linux_amd64.tar.gz" \
            | tar -xzf - -C /tmp
          find /tmp -type f -name apko -exec mv {} /usr/local/bin/apko \;
          chmod +x /usr/local/bin/apko

      - name: Build and load apko base image (justfile)
        run: just base

      - name: Verify base image runs
        run: docker run --rm gw2wrapper:latest

      - name: Build application image (justfile)
        run: just docker
