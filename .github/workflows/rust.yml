name: Rust CICD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cargo check
        run: just check

      - name: Cargo test
        run: just test

      - name: Cargo clippy
        run: just clippy

      - name: Cargo fmt
        run: just fmt

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cargo deny (advisories)
        run: just deny-advisories

      - name: Cargo deny (licenses)
        run: just deny-licenses

      - name: Cargo deny (bans & sources)
        run: just deny-bans

  build:
    name: Build & Container Verification
    runs-on: ubuntu-latest
    needs: [check, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install cargo-auditable
        run: cargo install cargo-auditable

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build release binary (musl)
        run: just build-release

      - name: Verify binary is static
        run: |
          file target/x86_64-unknown-linux-musl/release/hello-world
          ldd target/x86_64-unknown-linux-musl/release/hello-world || echo "Binary is static (ldd exit != 0 is expected)"

      - name: Install melange
        run: |
          curl -L https://github.com/chainguard-dev/melange/releases/download/v0.9.0/melange-amd64 -o /usr/local/bin/melange
          chmod +x /usr/local/bin/melange

      - name: Install apko
        run: |
          curl -L https://github.com/chainguard-dev/apko/releases/download/v0.14.0/apko-amd64 -o /usr/local/bin/apko
          chmod +x /usr/local/bin/apko

      - name: Build and load apko base image (justfile)
        run: just base

      - name: Verify base image runs
        run: docker run --rm gw2wrapper:latest

      - name: Build application image (justfile)
        run: just docker
