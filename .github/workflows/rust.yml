name: Rust CICD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check, Test & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install tools (mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18

      - name: Cargo check
        run: just check

      - name: Cargo test
        run: just test

      - name: Cargo clippy
        run: just clippy

      - name: Cargo fmt
        run: just fmt

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install tools (mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18

      - name: Cargo deny (advisories)
        run: just deny-advisories

      - name: Cargo deny (licenses)
        run: just deny-licenses

      - name: Cargo deny (bans & sources)
        run: just deny-bans

  build:
    name: Build & Container Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install tools (mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18

      # Ubuntu 24.04's AppArmor blocks the user namespaces melange's sandbox needs; allow them for bwrap only
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo tee /etc/apparmor.d/local-bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile local-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo systemctl reload apparmor

      - name: Test package, build image & scan with Trivy (justfile)
        run: just verify-image
        env:
          TRIVY_OUTPUT: trivy-report.txt

      - name: Publish Trivy report to job summary
        if: ${{ !cancelled() && hashFiles('trivy-report.txt') != '' }}
        run: |
          {
            echo "## Trivy image scan"
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
