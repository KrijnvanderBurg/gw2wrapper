name: Rust CICD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check, Test & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cargo check
        run: just check

      - name: Cargo test
        run: just test

      - name: Cargo clippy
        run: just clippy

      - name: Cargo fmt
        run: just fmt

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cargo deny (advisories)
        run: just deny-advisories

      - name: Cargo deny (licenses)
        run: just deny-licenses

      - name: Cargo deny (bans & sources)
        run: just deny-bans

  build:
    name: Build & Container Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install melange
        uses: chainguard-dev/actions/setup-melange@805da2efdffdc42b8afd8880e575a48b471ef544 # v1.6.37

      # No official install-only action exists for apko (apko-build/apko-publish
      # perform a full build+publish), so use the officially documented Homebrew install.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Install apko
        run: brew install apko

      - name: Build melange package and apko image (justfile)
        run: just base

      - name: Verify image tarball contains the application binary
        run: tar -tf gw2wrapper-apko.tar | grep -q 'usr/local/bin/hello-world'
