name: Rust CICD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_PARANOID: "1"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Test & Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install tools (mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: just
          cache: false

      - name: Cargo check
        run: just check

      - name: Cargo test
        run: just test

      - name: Cargo clippy
        run: just clippy

      - name: Cargo fmt
        run: just fmt

      - name: Cargo doc
        run: just doc

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install tools (mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: just cargo-deny
          cache: false

      - name: Cargo deny (advisories)
        run: just deny-advisories

      - name: Cargo deny (licenses)
        run: just deny-licenses

      - name: Cargo deny (bans & sources)
        run: just deny-bans

  lint:
    name: Repository Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for gitleaks
          fetch-depth: 0

      - name: Install tools (mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: just actionlint shellcheck zizmor gitleaks typos hadolint pre-commit
          cache: false

      - name: Zizmor
        run: just zizmor
        env:
          # Enables zizmor's online audits (e.g. impostor commits, known-vulnerable actions)
          GH_TOKEN: ${{ github.token }}

      - name: Actionlint
        run: just actionlint

      - name: Gitleaks
        run: just gitleaks

      - name: Typos
        run: just typos

      - name: Hadolint
        run: just hadolint

      - name: Justfile format
        run: just just-fmt

  build:
    name: Build & Container Verification (${{ matrix.arch }})
    # Native runners per arch: melange's bubblewrap runner cannot cross-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: just melange apko trivy grype
          cache: false

      # Official fix from melange for Ubuntu 24.04: https://github.com/chainguard-dev/melange/issues/1508
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo tee /etc/apparmor.d/local-bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile local-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo systemctl reload apparmor

      - name: Test package, build image & scan with Trivy and Grype (justfile)
        run: just verify-image
        env:
          TRIVY_FORMAT: sarif
          TRIVY_OUTPUT: trivy-${{ matrix.arch }}.sarif

      - name: Upload Trivy results to code scanning
        if: ${{ !cancelled() && hashFiles(format('trivy-{0}.sarif', matrix.arch)) != '' && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ matrix.arch }}.sarif
          category: trivy-${{ matrix.arch }}

      # Public key and signed packages only; the ephemeral private key never leaves the runner
      - name: Upload melange packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.arch }}
          path: |
            build/packages/${{ matrix.arch }}
            build/melange-${{ matrix.arch }}.rsa.pub
          if-no-files-found: error
          retention-days: 1

  image:
    name: Multi-arch Image
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: apko
          cache: false

      - name: Download melange packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: build
          merge-multiple: true

      # Same inputs as publish-image.sh, without pushing
      - name: Build multi-arch image
        run: apko build apko.yaml gw2wrapper:ci build/gw2wrapper.tar -b build/packages -k build/melange-x86_64.rsa.pub -k build/melange-aarch64.rsa.pub -p gw2wrapper

  publish:
    name: Publish, Sign & Attest
    # The signing identity is restricted to main and v* tags, also when triggered manually
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [check, security, lint, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: apko cosign
          cache: false

      - name: Download melange packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: build
          merge-multiple: true

      - name: Log in to GHCR
        run: cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish, sign & attest SBOMs
        id: publish
        uses: ./.github/actions/publish-image
        with:
          image: ghcr.io/krijnvanderburg/gw2wrapper

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/krijnvanderburg/gw2wrapper
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Verify signature & SBOM attestation
        uses: ./.github/actions/verify-image-signature
        with:
          image-ref: ghcr.io/krijnvanderburg/gw2wrapper@${{ steps.publish.outputs.digest }}
