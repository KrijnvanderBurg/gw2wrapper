name: Rust CICD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check, Test & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cargo check
        run: just check

      - name: Cargo test
        run: just test

      - name: Cargo clippy
        run: just clippy

      - name: Cargo fmt
        run: just fmt

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cargo deny (advisories)
        run: just deny-advisories

      - name: Cargo deny (licenses)
        run: just deny-licenses

      - name: Cargo deny (bans & sources)
        run: just deny-bans

  build:
    name: Build & Container Verification
    # setup-melange installs qemu-user-static, which has no installation candidate on 24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install melange
        uses: chainguard-dev/actions/setup-melange@805da2efdffdc42b8afd8880e575a48b471ef544 # v1.6.37

      - name: Build melange package (justfile)
        run: just melange-build

      - name: Build apko image
        uses: chainguard-images/actions/apko-build@main
        with:
          config: apko.yaml
          tag: gw2wrapper:latest

      - name: Smoke test image (non-root, read-only, no capabilities, no network)
        run: |
          image=$(docker load -i output.tar | sed -n 's/^Loaded image: //p' | tail -n1)
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "65532"
          test "$(docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --network=none "$image")" = "Hello, World!"
