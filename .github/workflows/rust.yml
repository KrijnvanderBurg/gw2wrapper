name: Rust CICD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cargo check
        run: just check

      - name: Cargo test
        run: just test

      - name: Cargo clippy
        run: just clippy

      - name: Cargo fmt
        run: just fmt

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cargo deny (advisories)
        run: just deny-advisories

      - name: Cargo deny (licenses)
        run: just deny-licenses

      - name: Cargo deny (bans & sources)
        run: just deny-bans

  build:
    name: Build & Container Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-auditable
        run: cargo install cargo-auditable

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build release binary
        run: just build-release

      - name: Verify binary
        run: |
          file target/release/hello-world
          ldd target/release/hello-world

      - name: Install melange
        uses: chainguard-dev/actions/setup-melange@805da2efdffdc42b8afd8880e575a48b471ef544 # v1.6.37

      # No official install-only action exists for apko (apko-build/apko-publish
      # perform a full build+publish), so use the officially documented Homebrew install.
      - name: Install apko
        run: brew install apko

      - name: Build and load apko base image (justfile)
        run: just base

      - name: Verify base image runs
        run: docker run --rm gw2wrapper:latest

      - name: Build application image (justfile)
        run: just docker
