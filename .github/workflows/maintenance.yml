name: Maintenance

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

env:
  MISE_PARANOID: "1"

jobs:
  rescan:
    name: Verify & re-scan published image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: cosign trivy grype

      - name: Log in to GHCR
        run: cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signature & SBOM attestation
        uses: ./.github/actions/verify-image-signature
        with:
          image-ref: ghcr.io/krijnvanderburg/gw2wrapper:latest

      - name: Scan with Trivy
        run: trivy image --config trivy.yaml ghcr.io/krijnvanderburg/gw2wrapper:latest

      - name: Scan with Grype
        run: grype --config .grype.yaml registry:ghcr.io/krijnvanderburg/gw2wrapper:latest
